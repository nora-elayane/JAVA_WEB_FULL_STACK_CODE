<body>
    <script>
        const taches = [
            { id: 1, titre: "Réviser React", faite: false },
            { id: 2, titre: "Push sur GitHub", faite: true },
            { id: 3, titre: "TP closures", faite: false },
            ];
        function pureAjouter(tache){
            return [...taches , tache ];
        }
        function pureSupprimer(id){
            return  taches.filter(function(a){return a.id !== id}) ; 


        }
        function pureBascular(id){
            return taches.map((a)=> a.id === id?{ ...a, faite : a.faite = !a.faite}:a)
            
        }
        console.log(pureAjouter({id: 4 , titre : "task edit user" , faite: false})) ; 
        console.log(pureSupprimer(1)) ; 
        console.log(pureBascular(3)) ; 
        console.log(taches) ; 
    </script>           
</body>

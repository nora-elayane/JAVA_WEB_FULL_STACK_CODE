<body>
    <script>
        function creerMinuteur(depart){
            let count = depart ; 
             function incrementSeconds(){
               return  ++count ; 
            } 
            return {incrementSeconds } ; 
        }
        let minuteur = creerMinuteur(0) ;
        setInterval(function(){
            let mi = minuteur.incrementSeconds()  
          if(mi <= 6){
            console.log(mi) ;
          }else{
            clearInterval() ;
          }
        },1000)
        

    </script>

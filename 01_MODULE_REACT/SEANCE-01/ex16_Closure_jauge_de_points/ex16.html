<!DOCTYPE html>

<body>
    <script>
        function creerJauge(depart){
            let score = depart ; 
            return function(points){
                score += points ; 
                return score ; 
            }
        }
        let  Jauge = creerJauge(10) ; 
        console.log(Jauge(5)) ;
        console.log(Jauge(3)) ; 
    </script>
</body>
